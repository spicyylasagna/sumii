<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Our Little Gift</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Figtree:wght@400;600&family=Gloock&display=swap">
<style>
/* Layout: one phone-width stage, seven scenes revealed one at a time, soft hearts behind, Back and Next pinned underneath. */
:root {
  --night: #1c1426;
  --night-2: #2a1d38;
  --paper: #f4eadf;
  --ink: #2b1f2e;
  --coral: #ff7a59;
  --rose: #e9a3b8;
  --rose-deep: #b8587a;
  --gold: #f4c97a;
  --muted: #b9a9c4;
  --display: "Gloock", "Georgia", serif;
  --body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --hand: "Caveat", "Segoe Print", "Bradley Hand", cursive;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: radial-gradient(120% 80% at 50% 0%, var(--night-2), var(--night) 60%);
  background-color: var(--night);
  color: var(--paper);
  font-family: var(--body);
  font-size: 16px;
  line-height: 1.5;
  min-height: 100vh;
  padding-block: 20px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow-x: hidden;
}
.app { position: relative; z-index: 1; max-width: 440px; margin: 0 auto; min-height: calc(100vh - 40px); display: flex; flex-direction: column; gap: 16px; }
.dots { display: flex; justify-content: center; gap: 8px; padding-top: 4px; }
@supports (height: 100dvh) { body { min-height: 100dvh; } .app { min-height: calc(100dvh - 40px); } }
@media (max-width: 380px) { .card .b { font-size: 1.15rem; } .paper p { font-size: 1.35rem; } .polaroid { flex-basis: 232px; } .pet { width: 76px; height: 74px; } .cake > .pet { right: -7px; width: 72px; } }
.dots i { width: 22px; height: 3px; border-radius: 2px; background: #ffffff26; transition: background .4s; }
.dots i.on { background: var(--gold); }
.scene { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; animation: rise .7s ease both; min-width: 0; }
@keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
h1, h2 { font-family: var(--display); font-weight: 400; margin: 0; text-wrap: balance; line-height: 1.1; }
h1 { font-size: clamp(2.2rem, 9vw, 3rem); }
h2 { font-size: clamp(1.7rem, 7vw, 2.2rem); }
.hint { color: var(--muted); margin: 0; font-size: .95rem; min-height: 1.5em; }
.hand { font-family: var(--hand); font-size: 1.6rem; color: var(--gold); margin: 0; line-height: 1.1; }
.btn {
  font: 600 1rem var(--body); color: var(--ink); background: var(--gold); border: 0; border-radius: 999px;
  padding: 14px 30px; cursor: pointer; min-width: 160px; min-height: 48px; transition: transform .15s, background .2s;
}
.btn:hover { transform: translateY(-2px); }
.btn.ghost { background: transparent; color: var(--paper); border: 1.5px solid #ffffff3d; }
.nextbar { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; min-height: 52px; padding-bottom: 6px; }
.nextbar .btn { animation: rise .5s ease both; min-width: 120px; }
:focus-visible { outline: 3px solid var(--coral); outline-offset: 3px; }

/* 1 gift box */
.gbox { position: relative; width: 190px; height: 150px; margin: 40px auto 0; }
.gbox .base { position: absolute; bottom: 0; left: 0; right: 0; height: 108px; background: var(--rose-deep); border-radius: 4px; }
.gbox .base::after, .gbox .lid::after { content: ""; position: absolute; left: 50%; width: 30px; transform: translateX(-50%); top: 0; bottom: 0; background: var(--gold); }
.gbox .lid { position: absolute; top: 0; left: -8px; right: -8px; height: 44px; background: var(--rose); border-radius: 4px; transform-origin: left bottom; transition: transform .8s cubic-bezier(.3,1.5,.5,1); }
.gbox .lid::before { content: ""; position: absolute; left: 50%; top: -22px; width: 56px; height: 24px; transform: translateX(-50%); border: 6px solid var(--gold); border-bottom: 0; border-radius: 28px 28px 0 0; }
.gbox.open .lid { transform: translate(-6px, -70px) rotate(-14deg); }
.tailwrap { position: absolute; left: 50%; top: 100%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; transition: opacity .5s; z-index: 2; }
.gbox.open .tailwrap { opacity: 0; pointer-events: none; }
.tail { width: 6px; height: 50px; background: var(--gold); }
.pull { width: 60px; height: 60px; border-radius: 50%; border: 0; background: var(--coral); box-shadow: 0 0 0 6px #ff7a5933; cursor: grab; touch-action: none; animation: bob 1.6s ease-in-out infinite; }
.pull.dragging { animation: none; }
.pull:active { cursor: grabbing; animation: none; }
@keyframes bob { 50% { transform: translateY(6px); } }
.tag { font-family: var(--hand); font-size: 1.5rem; background: var(--paper); color: var(--ink); padding: 4px 18px; border-radius: 4px 14px 14px 4px; transform: rotate(-3deg); }

/* 1b cake */
.cake { position: relative; width: 270px; height: 230px; margin-top: 8px; }
.plate { position: absolute; bottom: 0; left: 0; right: 0; height: 16px; border-radius: 50%; background: #ffffff30; }
.tier { position: absolute; left: 50%; margin-left: calc(var(--w) / -2); width: var(--w); height: 58px; border-radius: 10px; background: var(--c); transform-origin: 50% 100%; animation: drop .9s cubic-bezier(.3,1.2,.5,1) var(--d) both; }
.tier::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 14px; background: var(--fr); border-radius: 10px 10px 0 0; }
.tier::after { content: ""; position: absolute; left: 0; right: 0; top: 14px; height: 12px; background: radial-gradient(circle at 12px 0, var(--fr) 10px, transparent 11px) 0 0 / 24px 12px repeat-x; }
.tier .dec { position: absolute; left: 0; right: 0; bottom: 8px; text-align: center; color: var(--gold); font-size: 14px; letter-spacing: 8px; }
.t1 { --w: 230px; --c: #b8587a; --fr: #f4eadf; --d: .2s; bottom: 14px; }
.t2 { --w: 176px; --c: #e9a3b8; --fr: #f4eadf; --d: 1.1s; bottom: 70px; }
.t3 { --w: 122px; --c: #f4eadf; --fr: #e9a3b8; --d: 2s; bottom: 126px; }
.cake-candles { position: absolute; bottom: 184px; left: 50%; display: flex; gap: 20px; margin-left: -37px; animation: rise .7s 2.9s both; }
.cake-candle { position: relative; width: 12px; height: 34px; border-radius: 3px 3px 0 0; background: repeating-linear-gradient(145deg, var(--paper) 0 6px, var(--rose) 6px 12px); }
.cake-candle::before { content: ""; position: absolute; width: 2px; height: 6px; left: 5px; top: -5px; background: var(--ink); }
.cake-flame { position: absolute; width: 12px; height: 19px; left: 0; top: -22px; border-radius: 70% 30% 65% 35%; background: var(--gold); box-shadow: 0 0 15px #f4c97a66; transform-origin: center bottom; animation: cake-flicker 1.2s ease-in-out infinite alternate; }
.cake-candle:nth-child(2) .cake-flame { animation-delay: -.4s; }
.cake-candle:nth-child(3) .cake-flame { animation-delay: -.8s; }
.cake.blown .cake-flame { display: none; }
.cake.blown .cake-candle::after { content: ""; position: absolute; left: 3px; top: -15px; width: 6px; height: 10px; border-radius: 50%; background: #f4eadf66; animation: cake-smoke 1.5s ease-out both; }
@keyframes cake-flicker { to { transform: scale(.88, 1.1) rotate(6deg); } }
@keyframes cake-smoke { from { opacity: .7; transform: translateY(0) scale(.7); } to { opacity: 0; transform: translateY(-35px) scale(2); } }
@keyframes drop { 0% { opacity: 0; transform: translateY(-380px); } 8% { opacity: 1; } 55% { opacity: 1; transform: translateY(0); } 70% { transform: scaleY(.86); } 85% { transform: scaleY(1.04); } 100% { opacity: 1; transform: none; } }
.fphoto { width: min(100%, 340px); height: auto; max-height: 55vh; border-radius: 12px; object-fit: contain; border: 4px solid var(--gold); display: block; margin: 0 auto 12px; }

/* 2 candle */
.candle { width: 150px; height: 260px; overflow: visible; display: block; pointer-events: none; }
.candlebtn { background: none; border: 0; padding: 12px 40px; cursor: pointer; -webkit-tap-highlight-color: transparent; outline: none; border-radius: 16px; }
.candlebtn:focus-visible { outline: 3px solid var(--coral); }
.candlebtn:disabled { cursor: default; }
.flame { transform-origin: 60px 90px; animation: flick 1.4s ease-in-out infinite; }
@keyframes flick { 0%,100% { transform: scale(1) rotate(-1deg); } 50% { transform: scale(1.06,.96) rotate(2deg); } }
.smoke circle { fill: #ffffff55; opacity: 0; }
.smoking .smoke circle { animation: smoke 2.4s ease-out both; }
.smoking .smoke circle:nth-child(2) { animation-delay: .3s; }
.smoking .smoke circle:nth-child(3) { animation-delay: .6s; }
@keyframes smoke { 0% { opacity: .8; transform: translateY(0) scale(.6); } 100% { opacity: 0; transform: translateY(-70px) scale(2.2); } }

/* 3 memories */
.reel { display: flex; gap: 18px; overflow-x: auto; scroll-snap-type: x mandatory; width: 100vw; max-width: 100vw; padding: 22px max(16px, 50vw - 130px); scrollbar-width: none; }
.reel::-webkit-scrollbar { display: none; }
.polaroid { flex: 0 0 260px; scroll-snap-align: center; background: var(--paper); color: var(--ink); padding: 12px 12px 42px; border-radius: 4px; box-shadow: 0 14px 30px #0006; transform: rotate(var(--tilt, -2deg)); text-align: left; }
.polaroid .ph { aspect-ratio: 4 / 5; border-radius: 2px; overflow: hidden; display: grid; place-items: center; background: linear-gradient(135deg, var(--rose), var(--coral)); }
.polaroid .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.polaroid p { margin: 10px 0 0; font-family: var(--hand); font-size: 1.45rem; line-height: 1.15; }
.polaroid small { color: #7b6a7f; font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; }

/* 4 reasons */
.cards { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; width: 100%; }
.card { position: relative; aspect-ratio: 1 / 1.05; border: 0; padding: 0; background: none; cursor: pointer; perspective: 600px; font: inherit; color: inherit; min-width: 0; -webkit-tap-highlight-color: transparent; }
.card .in { position: absolute; inset: 0; transition: transform .6s; transform-style: preserve-3d; }
.card.flip .in { transform: rotateY(180deg); }
.card .f, .card .b { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 14px; display: grid; place-items: center; padding: 14px; }
.card .f { background: var(--rose-deep); font-family: var(--display); font-size: 2.4rem; color: var(--gold); }
.card .b { background: var(--paper); color: var(--ink); transform: rotateY(180deg); font-family: var(--hand); font-size: 1.35rem; line-height: 1.15; }

/* 5 letter */
.env { position: relative; width: 240px; height: 160px; background: var(--rose); border: 0; border-radius: 6px; cursor: pointer; padding: 0; -webkit-tap-highlight-color: transparent; }
.env::before { content: ""; position: absolute; inset: 0; clip-path: polygon(0 0, 50% 58%, 100% 0, 100% 100%, 0 100%); background: var(--rose-deep); border-radius: 6px; }
.env .seal { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 44px; height: 44px; border-radius: 50%; background: var(--coral); color: #fff; display: grid; place-items: center; font-size: 1.3rem; animation: bob 1.6s ease-in-out infinite; }
.paper { background: var(--paper); color: var(--ink); border-radius: 6px; padding: 26px 24px; text-align: left; width: 100%; box-shadow: 0 18px 40px #0006; animation: rise .8s ease both; }
.paper p { font-family: var(--hand); font-size: 1.5rem; line-height: 1.25; margin: 0 0 12px; }
.paper .sign { text-align: right; color: var(--rose-deep); font-weight: 700; margin: 6px 0 0; }

/* 6 question */
.yesno { position: relative; display: flex; gap: 16px; align-items: center; justify-content: center; flex-wrap: wrap; min-height: 120px; }
#no { transition: transform .25s ease; }
.fin { animation: rise .8s ease both; }

/* Little companions: small, decorative, and clear of all controls. */
.pet { display: block; width: 88px; height: 84px; pointer-events: none; user-select: none; flex: none; }
.pet svg { width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 3px 2px #1c142622); }
.pet-body { transform-origin: 60px 83px; animation: pet-breathe 3.8s ease-in-out infinite; }
.pet-eyes { transform-box: fill-box; transform-origin: center; animation: pet-blink 6s infinite; }
.pet-tail { transform-origin: 81px 83px; animation: pet-tail 3s ease-in-out infinite; }
.pet-hop .pet-body { animation: pet-hop 3.4s ease-in-out infinite; }
.pet-hang .pet-body { transform-origin: 60px 84px; animation: pet-sway 4s ease-in-out infinite; }
.pet-nibble .pet-paw { transform-origin: 65px 75px; animation: pet-nibble 2.6s ease-in-out infinite; }
.pet-air { opacity: 0; }
.pet-blow .pet-air { animation: pet-puff 2.8s ease-out infinite; }
.pet-blow .pet-mouth, .pet-kiss .pet-mouth { display: none; }
.pet-pucker { display: none; }
.pet-blow .pet-pucker, .pet-kiss .pet-pucker { display: block; }
.pet-kiss .pet-body { animation: none; }
.kiss-heart { opacity: 0; animation: heart-kiss 1.2s ease-out both; animation-delay: var(--delay); }
@keyframes heart-kiss { 0% { opacity: 0; transform: translate(0, 0) scale(.3); } 18% { opacity: 1; } 75% { opacity: .9; } 100% { opacity: 0; transform: translate(var(--kiss-x), var(--kiss-y)) scale(1.15); } }
.pet-heart { transform-origin: 60px 45px; animation: pet-heart 3s ease-in-out infinite; }
.gbox > .pet { position: absolute; right: -43px; bottom: -6px; z-index: 1; }
.cake > .pet { position: absolute; right: -23px; bottom: 0; width: 84px; }
.wish-tableau { position: relative; }
.wish-tableau > .pet { position: absolute; left: -8px; bottom: 145px; }
.polaroid { position: relative; }
.polaroid > .pet { position: absolute; right: -9px; top: -45px; width: 68px; height: 66px; z-index: 1; }
.reel { padding-top: 52px; }
.pet-note { position: relative; width: 240px; padding-top: 38px; }
.pet-note > .pet { position: absolute; right: -6px; top: -14px; width: 76px; height: 72px; z-index: 1; }
.pet-letter { position: relative; width: 100%; padding-top: 38px; }
.pet-letter > .pet { position: absolute; right: 12px; top: -12px; width: 76px; height: 72px; }
.final-photo { position: relative; width: fit-content; max-width: 100%; margin: 30px auto 0; }
.final-photo > .pet { position: absolute; right: -6px; top: -46px; width: 72px; height: 70px; }
@keyframes pet-breathe { 50% { transform: translateY(1px) scale(1.015, .985); } }
@keyframes pet-blink { 0%, 43%, 47%, 100% { transform: scaleY(1); } 45% { transform: scaleY(.1); } }
@keyframes pet-tail { 50% { transform: rotate(13deg); } }
@keyframes pet-hop { 0%, 18%, 42%, 100% { transform: translateY(0); } 23%, 37% { transform: translateY(1px) scale(1.04, .96); } 30% { transform: translateY(-12px) rotate(-4deg); } }
@keyframes pet-sway { 25% { transform: rotate(-4deg); } 75% { transform: rotate(4deg); } }
@keyframes pet-nibble { 25%, 65% { transform: translate(-3px, -6px) rotate(-7deg); } }
@keyframes pet-puff { 0%, 40%, 100% { opacity: 0; transform: translateX(0); } 55% { opacity: .75; } 85% { opacity: 0; transform: translate(15px, -5px); } }
@keyframes pet-heart { 50% { transform: translateY(-3px) scale(1.06); } }
@media (prefers-reduced-motion: reduce) { .pet * { animation: none !important; } .pet-blow .pet-air { opacity: .6; } .kiss-heart { opacity: 1; transform: translate(var(--kiss-x), var(--kiss-y)) scale(.8); } }

/* Quiet hearts behind every scene. */
.background-hearts { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; }
.background-hearts svg { position: absolute; width: var(--size); height: var(--size); left: var(--x); top: var(--y); opacity: var(--alpha); transform: rotate(var(--turn)); }
.pet-kiss-loop .kiss-heart { animation-name: heart-kiss-loop; animation-duration: 3.8s; animation-iteration-count: infinite; }
@keyframes heart-kiss-loop { 0%, 8% { opacity: 0; transform: translate(0, 0) scale(.3); } 18% { opacity: 1; } 42% { opacity: .85; } 65%, 100% { opacity: 0; transform: translate(var(--kiss-x), var(--kiss-y)) scale(1.15); } }
.cake-bites { position: absolute; inset: 0; pointer-events: none; }
.cake-bites svg { opacity: 0; position: absolute; bottom: -4px; width: 29px; height: 33px; }
.cake-bites svg:nth-child(1) { left: 21px; transform: rotate(-9deg); }
.cake-bites svg:nth-child(2) { left: 121px; transform: rotate(6deg); }
.cake-bites svg:nth-child(3) { left: 219px; transform: rotate(-5deg); }
.cake > .cake-bear { z-index: 3; left: 0; right: auto; bottom: -8px; width: 68px; height: 68px; }
.cake > .pet-run { left: 0; right: auto; bottom: -8px; width: 68px; height: 68px; animation: cake-run 11s ease-in-out infinite; }
.pet-run .pet-body { animation: running-bounce .4s ease-in-out infinite; }
.pet-run .pet-cutter { transform-origin: 75px 76px; animation: cake-cut 11s ease-in-out infinite; }
.cake.blown .cake-bites svg { animation: slice-serve 11s ease-out infinite; }
.cake.blown .cake-bites svg:nth-child(2) { animation-delay: 2.7s; }
.cake.blown .cake-bites svg:nth-child(3) { animation-delay: 5.4s; }
@keyframes slice-serve { 0%, 3% { opacity: 0; transform: translateY(-6px) scale(.8); } 8%, 85% { opacity: 1; transform: translateY(0) scale(1); } 100% { opacity: 0; transform: translateY(2px) scale(1); } }
@keyframes cake-cut { 0%, 5%, 25%, 30%, 49%, 54%, 65%, 100% { transform: rotate(-25deg); } 8%, 11%, 33%, 36%, 57%, 60% { transform: rotate(28deg) translateY(4px); } }
.pet-excited .pet-body { animation: kitten-excited 1.1s ease-in-out infinite; }
.pet-excited .happy-paws { transform-origin: 60px 70px; animation: happy-paws .55s ease-in-out infinite alternate; }
.pet-excited .happy-sparkles { animation: happy-sparkles 1.1s ease-in-out infinite; }
@keyframes kitten-excited { 0%, 100% { transform: translateY(0); } 18% { transform: scale(1.04, .95); } 48% { transform: translateY(-15px) rotate(-5deg); } 75% { transform: translateY(-3px) rotate(4deg); } }
@keyframes happy-paws { to { transform: translateY(-5px) rotate(4deg); } }
@keyframes happy-sparkles { 50% { opacity: .3; } }
.pet-run .pet-foot { transform-box: fill-box; transform-origin: center; animation: running-feet .4s ease-in-out infinite alternate; }
.pet-run .pet-foot + .pet-foot { animation-delay: -.2s; }
@keyframes cake-run { 0%, 12% { transform: translate(0, 0); } 25%, 35% { transform: translate(97px, -4px); } 49%, 59% { transform: translate(197px, 0); } 63% { transform: translate(197px, 0) scaleX(-1); } 77%, 85% { transform: translate(97px, 7px) scaleX(-1); } 96% { transform: translate(0, 0) scaleX(-1); } 100% { transform: translate(0, 0); } }
@keyframes running-bounce { 50% { transform: translateY(-3px) rotate(2deg); } }
@keyframes running-feet { to { transform: translateY(-3px) rotate(15deg); } }
@media (prefers-reduced-motion: reduce) { .cake > .pet-run { animation: none !important; transform: translate(97px, 0); } .cake.blown .cake-bites svg { animation: none !important; opacity: 1; } }

canvas#fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; }
@media (prefers-reduced-motion: reduce) { * { animation-duration: .01ms !important; transition-duration: .01ms !important; } }
</style>
</head>
<body>


<div class="background-hearts" id="bgh" aria-hidden="true"></div>
<canvas id="fx" aria-hidden="true"></canvas>
<main class="app">
  <div class="dots" id="dots" aria-hidden="true"></div>
  <button class="btn ghost" id="music" type="button" aria-pressed="false" style="align-self:center;min-width:0;min-height:40px;padding:8px 18px;font-size:.85rem">Music off</button>
  <audio id="birthday-music" src="audio/happy-birthday-piano.mp3" loop preload="none"></audio>
  <div id="stage"></div>
  <div class="nextbar" id="nextbar"></div>
</main>

<script>
/* ===== EDIT THIS: everything personal lives here ===== */
const GIFT = {
  to: "Sumi",
  age: 19,
  from: "",
  finale: "photos/finale.jpg",
  photos: [
    { src: "photos/p1.jpg", pos: "50% 30%", caption: "Pink, balloons and that smile", date: "" },
    { src: "photos/p2.jpg", pos: "52% 50%", caption: "Red saree, green all around", date: "" },
    { src: "photos/p3.jpg", pos: "50% 30%", caption: "You, with roses", date: "" },
    { src: "photos/p4.jpg", pos: "40% 60%", caption: "A quiet evening in the park", date: "" },
    { src: "photos/p5.jpg", pos: "50% 50%", caption: "Us, standing together on the grass", date: "" },
    { src: "photos/p6.jpg", pos: "55% 38%", caption: "You, by the train window", date: "" },
    { src: "photos/p7.jpg", pos: "50% 55%", caption: "Caught in the auto's mirror", date: "" }
  ],
  reasons: [
    "You're the best girlfriend in this world.",
    "You make me happy.",
    "You make me feel loved.",
    "Nobody listens like you do.",
    "You remember the little things I forget.",
    "You're my most favourite person in this world."
  ],
  letter: [
    "Baby,",
    "I feel very lucky to have you in my life. I haven't thanked you enough for staying with me even after everything we went through.",
    "I know times are tough, and I pray to god that this year life is gentle for you.",
    "I know we have this distance between us but I don't care. I love you so much.",
    "I love you, baby."
  ],
  question: "Will you keep being my favourite person?",
  yesReply: "Good. That was the only answer I was ready for."
};
/* ===== end of editable part ===== */

const $ = (s, r = document) => r.querySelector(s);
const stage = $("#stage"), nextbar = $("#nextbar"), dotsEl = $("#dots");
const hasPhotos = GIFT.photos.some(p => p.src);
const TOTAL = hasPhotos ? 7 : 6;
let cur = 0, revision = 0, finalShown = false;

/* music */
const music = $("#birthday-music"), musicButton = $("#music");
let musicChosen = false;
music.volume = 0.6;
async function playMusic() {
  try {
    await music.play();
    musicButton.textContent = "Music on";
    musicButton.setAttribute("aria-pressed", "true");
  } catch (e) {

/* confetti */
const cv = $("#fx"), cx = cv.getContext("2d");
let parts = [], raf = 0;
function sizeCv() { cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; }
addEventListener("resize", sizeCv); sizeCv();
function burst(kind, x = innerWidth / 2, y = innerHeight * 0.45, n = 90) {
  const colors = ["#f4c97a", "#ff7a59", "#e9a3b8", "#f4eadf", "#b8587a"];
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = 3 + Math.random() * 7;
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 4, r: 4 + Math.random() * 6, rot: Math.random() * 6, vr: (Math.random() - .5) * .3, c: colors[i % colors.length], life: 0, kind });
  }
  if (!raf) raf = requestAnimationFrame(tick);
}
function tick() {
  cx.setTransform(devicePixelRatio, 0, 0, devicePixelRatio, 0, 0);
  cx.clearRect(0, 0, innerWidth, innerHeight);
  parts = parts.filter(p => p.life < 140);
  for (const p of parts) {
    p.life++; p.vy += .22; p.vx *= .99; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
    cx.save(); cx.translate(p.x, p.y); cx.rotate(p.rot); cx.globalAlpha = Math.max(0, 1 - p.life / 140); cx.fillStyle = p.c;
    if (p.kind === "heart") { cx.font = p.r * 3 + "px serif"; cx.fillText("♥", -p.r, p.r); }
    else cx.fillRect(-p.r / 2, -p.r / 3, p.r, p.r * .6);
    cx.restore();
  }
  raf = parts.length ? requestAnimationFrame(tick) : 0;
  if (!raf) cx.clearRect(0, 0, innerWidth, innerHeight);
}

function setNext(label, handler) {
  nextbar.innerHTML = "";
  if (cur > 0) {
    const back = document.createElement("button");
    back.className = "btn ghost"; back.textContent = "Back";
    back.onclick = () => go(finalShown ? 6 : (cur === 4 && !hasPhotos ? 2 : cur - 1));
    nextbar.appendChild(back);
  }
  if (!label) return;
  const b = document.createElement("button");
  b.className = "btn"; b.textContent = label; b.onclick = handler;
  nextbar.appendChild(b);
}
function el(html) { const t = document.createElement("template"); t.innerHTML = html.trim(); return t.content.firstChild; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

const scenes = [scene1, sceneCake, scene2, scene3, scene4, scene5, scene6];
function go(n) {
  revision++; finalShown = false; cur = n;
  const di = hasPhotos || n < 3 ? n : n - 1;
  [...dotsEl.children].forEach((d, i) => d.classList.toggle("on", i <= di));
  stage.innerHTML = ""; setNext(null);
  stage.appendChild(scenes[n]());
  scrollTo(0, 0);
}

  const excitement = action === "excited" ? `<g class="happy-paws" fill="${fur}"><path d="M39 76 Q20 74 18 58 Q18 52 25 54 L42 67"/><path d="M81 76 Q100 74 102 58 Q102 52 95 54 L78 67"/></g><g class="happy-sparkles" stroke="#f4c97a" fill="none" stroke-width="2"><path d="M13 29 v10 M8 34 h10 M106 18 v10 M101 23 h10 M8 52 l-4 -4 M109 43 l5 -5"/></g>` : "";

  if (cat && asleep) return `<span class="pet pet-rest ${placement}${action === "kiss" ? "" : " pet-kiss-loop"}" aria-hidden="true"><svg viewBox="0 0 120 110" xmlns="http://www.w3.org/2000/svg" focusable="false"><g class="pet-body" stroke="${dark}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path class="pet-tail" d="M89 81 Q116 85 107 67 Q103 61 99 67" fill="none" stroke="${fur}" stroke-width="11"/><ellipse cx="76" cy="82" rx="30" ry="17" fill="${fur}"/><path d="M17 70 L17 47 Q18 43 23 47 L34 57 Q43 54 50 58 L61 49 Q66 46 65 52 L64 73Z" fill="${fur}"/><path d="M22 52 l1 12 9 -5 M59 55 l-6 8 8 3" fill="#e8b3ab" stroke="none"/><path d="M15 72 Q15 57 39 57 Q65 57 65 74 Q65 90 40 90 Q15 90 15 72Z" fill="${fur}"/><path d="M26 72 q4 4 8 0 M46 72 q4 4 8 0" fill="none"/><ellipse cx="23" cy="80" rx="5" ry="3" fill="#efb3ac" stroke="none"/><ellipse cx="57" cy="80" rx="5" ry="3" fill="#efb3ac" stroke="none"/><path d="M37 78 q3 3 6 0 M40 79 v3" fill="none" stroke-width="1.6"/><ellipse cx="28" cy="92" rx="12" ry="6" fill="${fur}"/><ellipse cx="53" cy="93" rx="12" ry="6" fill="${fur}"/><path d="M74 68 q8 -5 16 2" fill="none" stroke="#ceaa8e"/></g><g transform="translate(-24 22)">${kisses}</g></svg></span>`;

/* 1. ribbon */
function scene1() {
  const s = el(`<section class="scene">
    <div class="tag">For my baby</div>
    <h1>Something is inside.</h1>
    <div class="gbox" id="gbox"><div class="base"></div><div class="lid"></div>${pet("kitten", "rest")}
      <div class="tailwrap"><div class="tail" id="tail"></div><button class="pull" id="pull" aria-label="Pull the ribbon"></button></div></div>
    <p class="hint" id="h1" style="margin-top:110px">Tap the ribbon or pull it down a little.</p></section>`);
  const gbox = $("#gbox", s), tail = $("#tail", s), pull = $("#pull", s), hint = $("#h1", s);
  let y0 = null, dy = 0, opened = false;
  const open = () => {
    if (opened) return; opened = true; gbox.classList.add("open"); $(".pet", s).replaceWith(el(pet("kitten", "excited"))); hint.textContent = "Open.";
    startMusic(); burst("conf"); later(() => setNext("See what is inside", () => go(1)), 900);
  };
  const resetPull = () => { y0 = null; dy = 0; pull.classList.remove("dragging"); tail.style.transform = ""; pull.style.transform = ""; };
  pull.addEventListener("pointerdown", e => {
    if (e.button !== 0) return;
    startMusic(); y0 = e.clientY; dy = 0;
    pull.classList.add("dragging"); pull.setPointerCapture(e.pointerId);
  });
  pull.addEventListener("pointermove", e => {
    if (y0 === null || opened) return;
    dy = Math.max(0, Math.min(80, e.clientY - y0));
    tail.style.transformOrigin = "top";
    tail.style.transform = `scaleY(${1 + dy / 50})`;
    pull.style.transform = `translateY(${dy}px)`;
    if (dy >= 24) open();
  });
  pull.addEventListener("pointerup", () => { if (y0 !== null) open(); resetPull(); });
  pull.addEventListener("pointercancel", resetPull);
  pull.addEventListener("lostpointercapture", resetPull);
  pull.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); open(); } });
  pull.addEventListener("click", open);
  return s;
}

  const svg = $("#candle", s), flame = $("#flame", s), glow = $("#glow", s), cbtn = $("#cbtn", s), hint = $("#h2", s);
